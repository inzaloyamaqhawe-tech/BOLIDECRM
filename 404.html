<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Bolide CRM</title>
    <!--
      GitHub Pages has no real server-side router — a hard refresh or a
      shared link to a client-side route like /BOLIDECRM/pipeline has no
      matching file, so GitHub serves this 404 page instead of a blank error.
      This redirects back to index.html with the intended path encoded in
      the query string; a matching script in index.html decodes it and
      restores the real URL via history.replaceState before React Router
      ever sees it. (Standard technique: rafgraph/spa-github-pages)
    -->
    <script>
      var segmentCount = 1; // matches the repo name segment: /BOLIDECRM/
      var l = window.location;
      l.replace(
        l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
        l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
        "/?p=/" + l.pathname.slice(1).split("/").slice(segmentCount).join("/").replace(/&/g, "~and~") +
        (l.search ? "&q=" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
